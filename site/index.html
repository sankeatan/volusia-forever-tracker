<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volusia Forever Tracker</title>
  <meta name="description" content="Independent tracker of Volusia County conservation lands, the conservation registry, and changes to both.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./">Volusia Forever Tracker</a>
      <nav><a href="./" aria-current="page">Map</a><a href="changes.html">Change log</a></nav>
    </div>
    <div class="wrap"><p id="status" class="status">Loading data status…</p></div>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>

  <main class="wrap">
    <section aria-labelledby="summary-h">
      <h1 id="summary-h" class="visually-hidden">Summary</h1>
      <div id="cards" class="cards"></div>
      <p id="summary-note" class="note"></p>
    </section>

    <section class="map-section" aria-label="Map">
      <div id="map"></div>
    </section>

    <section aria-labelledby="table-h">
      <h2 id="table-h">Records</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="table-tools">
        <label for="search" class="visually-hidden">Search records</label>
        <input id="search" type="search" placeholder="Search by name, parcel ID, owner…" autocomplete="off">
        <span id="table-count" class="muted"></span>
      </div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p>Independent project. Not affiliated with Volusia County. All figures come from the county's published GIS layers, snapshotted daily; each snapshot is kept in this project's public history.</p>
    <p id="sources"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
