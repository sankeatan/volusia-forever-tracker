name: Daily snapshot

on:
  schedule:
    - cron: '17 11 * * *' # ~7:17 a.m. EDT / 6:17 a.m. EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A failed fetch still deploys, so the site shows its stale-data banner; the job fails at the end.
      - name: Fetch county layers
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.ts

      - name: Diff against previous snapshot
        if: steps.fetch.outcome == 'success'
        run: node scripts/diff.ts

      - name: Build site
        run: node scripts/build.ts

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: snapshot $(TZ=America/New_York date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report fetch failure
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::error::County data fetch failed; site is showing the stale-data banner."
          exit 1
