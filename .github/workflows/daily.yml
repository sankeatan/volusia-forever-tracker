name: Daily snapshot

on:
  schedule:
    - cron: '17 11 * * *' # ~7:17 a.m. EDT / 6:17 a.m. EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A failed fetch still builds and deploys, so the site shows its stale-data banner.
      - name: Fetch county layers
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.ts

      - name: Diff against previous snapshot
        if: steps.fetch.outcome == 'success'
        run: node scripts/diff.ts

      - name: Build site
        run: node scripts/build.ts

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: snapshot $(TZ=America/New_York date +%F)"
          git push

      # Deploying is opt-in: set the repo variable DEPLOY_PAGES=true once Pages is enabled.
      - if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    if: always() && needs.update.result == 'success' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

  report:
    needs: [update, deploy]
    if: always() && needs.update.outputs.fetch != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::County data fetch failed; the site is showing the stale-data banner."
          exit 1
